<!DOCTYPE html>
<html lang="en">
<head>
    <title>Customer Feedback</title>
</head>
<body>
    <h1>Customer Feedback Survey</h1>
    <p><em>Your opinion matters to us! Please share your experience.</em></p>
    <form action="/submit" method="post">
        <fieldset>
            <legend>Customer Information</legend>

            <label for="user-name">Full Name *</label><br>
            <input type="text" id="user-name" name="Full Name" placeholder="Enter your full name" required/><br><br>

            <label for="user-email">Email Address *</label><br>
            <input type="email" id="user-email" name="Email" placeholder="your.email@example.com" required/><br><br>

            <label for="user-phone-number">Phone Number</label><br>
            <input type="tel" id="user-phone-number" name="Phone Number" placeholder="+1 (555) 123-4567"/><br><br>

            <label for="user-id">Customer ID</label><br>
            <input type="text" id="user-id" name="Customer ID" placeholder="Enter your customer ID"/><br><br>
        </fieldset>
        <fieldset>
            <legend>Service Evaluation</legend>

            <label for="user-rate">Overall Service Rating (1-5) *</label><br>

            <input type="radio" id="rating-1" name="Rating" value="1" required/>
            <label for="rating-1">1-Poor</label><br>

            <input type="radio" id="rating-2" name="Rating" value="2" required/>
            <label for="rating-2">2-Fair</label><br>

            <input type="radio" id="rating-3" name="Rating" value="3" required/>
            <label for="rating-3">3-Good</label><br>

            <input type="radio" id="rating-4" name="Rating" value="4" required/>
            <label for="rating-4">4-Very Good</label><br>

            <input type="radio" id="rating-5" name="Rating" value="5" required/>
            <label for="rating-5">5-Excellent</label><br><br>

            <label for="service-category">Service Category *</label><br>
            <select id="service-category" name="Service Category" required>
                <option value="">Select service category</option>
                <option value="Technical Support">Technical Support</option>
                <option value="Sales">Sales</option>
                <option value="Billing">Billing</option>
                <option value="General Inquiry">General Inquiry</option>
            </select><br><br>

            <label for="user-recommend">Would you recommend our service to others? *</label><br>
            <input type="radio" id="recommend-yes" name="Recommend" value="Yes" required/>
            <label for="recommend-yes">Yes, definitely</label><br>

            <input type="radio" id="recommend-maybe" name="Recommend" value="Maybe"required/>
            <label for="recommend-maybe">Maybe</label><br>

            <input type="radio" id="recommend-no" name="Recommend" value="No" required/>
            <label for="recommend-no">No, I would not</label><br><br>
        </fieldset>
        <fieldset>
            <legend>Experience Details</legend>
            <label for="user-date">Visit Date</label><br>
            <input type="date" id="user-date" name="Date of Experience" required/><br><br>

            <label for ="user-hear">How did you hear about us? (Select all that apply)</label><br>
            <input type="checkbox" id="hear-social" name="hearing" value="Social Media"/>
            <label for="hear-social">Social Media</label><br>

            <input type="checkbox" id="hear-friend" name="hearing" value="Friend/Family"/>
            <label for="hear-friend">Friend/Family Recommendation</label><br>

            <input type="checkbox" id="hear-ad" name="hearing" value="Advertisement"/>
            <label for="hear-ad">Advertisement</label><br>

            <input type="checkbox" id="hear-search" name="hearing" value="Search Engine"/>
            <label for="hear-search">Search Engine</label><br>

            <input type="checkbox" id="hear-other" name="hearing" value="Other"/>
            <label for="hear-other">Other</label><br><br>

            <label for="user-comments">Additional Comments *</label><br>
            <textarea id="user-comments" name="Additional Comments" minlength="10" placeholder="Please share your detailed feedback here..." required></textarea><br><br>
        </fieldset>
        <fieldset>
            <legend>Contact Preferences</legend>
            <label for="contact-prefer">Preferred Contact Method</label><br>
            <input type="radio" id="contact-email" name="Contact Method" value="Email"/>
            <label for="contact-email">Email</label><br>

            <input type="radio" id="contact-phone" name="Contact Method" value="Phone"/>
            <label for="contact-phone">Phone</label><br>

            <input type="radio" id="contact-sms" name="Contact Method" value="SMS"/>
            <label for="contact-sms">SMS</label><br>

            <input type="radio" id="contact-mail" name="Contact Method" value="Postal Mail"/>
            <label for="contact-mail">Postal Mail</label><br>

            <input type="radio" id="contact-none" name="Contact Method" value="None"/>
            <label for="contact-none">Do Not contact me</label><br><br>

            <label for="contact-time">Best Time to Contact</label><br>
            <select id="contact-time" name="Best Time to Contact">
                <option value="">Select preferred time</option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
            </select><br><br>
        </fieldset><br>
        <input type="checkbox" id="confirm" name="confirm" value="confirm" required/>
        <label for="confirm">I confirm that all information provided is accurate *</label><br><br>

        <input type="submit" value="Submit Feedback"/>
        <input type="reset" value="Clear All Fields"/>
    </form>
</body>
</html>
